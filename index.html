<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Quarantine Round</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700;800&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Layout: dark navigation rail + light workspace. Each role gets its own accent colour; fever grades share one scale everywhere. */
:root{
  --bg:#F1F4F9; --surface:#FFFFFF; --surface2:#F6F8FC; --ink:#0F1B2D; --muted:#5C6B80; --line:#E0E6EF;
  --shadow:0 1px 2px rgba(15,27,45,.05),0 6px 18px rgba(15,27,45,.05);
  --nav:#0F1B2D; --nav-ink:#D5DEEC; --nav-mute:#8193AE; --nav-line:#22324A; --nav-hover:#1A2A42;
  --on-accent:#FFFFFF;
  --a-nurse:#0E8F8A; --as-nurse:#D6F2F0;
  --a-doctor:#4C5FD7; --as-doctor:#E3E7FC;
  --a-admin:#C26A12; --as-admin:#FBEAD4;
  --a-head:#8A3FB5; --as-head:#EEDFF7;
  --accent:var(--a-nurse); --accent-soft:var(--as-nurse);
  --ok:#1E8A55; --ok-soft:#D9F2E4;
  --low:#A8680A; --low-soft:#FAEDCB;
  --fever:#D2501B; --fever-soft:#FCE3D6;
  --crit:#C2273A; --crit-soft:#F9DADF;
  --display:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;
  --body:'Figtree','Segoe UI',system-ui,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0A111A; --surface:#121B27; --surface2:#172233; --ink:#E6EDF7; --muted:#8A9AB2; --line:#223149;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.25);
    --nav:#0D1623; --nav-line:#1C2A40; --nav-hover:#16243A;
    --on-accent:#08111B;
    --a-nurse:#3FC4BE; --as-nurse:#0F3A3A; --a-doctor:#8F9DFF; --as-doctor:#1D2350; --a-admin:#F0A04B; --as-admin:#3A2A12; --a-head:#D08FF2; --as-head:#35194A;
    --ok:#5FD08F; --ok-soft:#12301F; --low:#E6B04F; --low-soft:#3A2B0E; --fever:#FF8A5C; --fever-soft:#3C2013; --crit:#FF7A8A; --crit-soft:#401A22;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0A111A; --surface:#121B27; --surface2:#172233; --ink:#E6EDF7; --muted:#8A9AB2; --line:#223149;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.25);
  --nav:#0D1623; --nav-line:#1C2A40; --nav-hover:#16243A;
  --on-accent:#08111B;
  --a-nurse:#3FC4BE; --as-nurse:#0F3A3A; --a-doctor:#8F9DFF; --as-doctor:#1D2350; --a-admin:#F0A04B; --as-admin:#3A2A12; --a-head:#D08FF2; --as-head:#35194A;
  --ok:#5FD08F; --ok-soft:#12301F; --low:#E6B04F; --low-soft:#3A2B0E; --fever:#FF8A5C; --fever-soft:#3C2013; --crit:#FF7A8A; --crit-soft:#401A22;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:14.5px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;letter-spacing:-.015em}
h1{font-size:1.65rem;font-weight:800}
h2{font-size:1.25rem;font-weight:700}
h3{font-size:1.02rem;font-weight:700}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:12px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.ic{display:block;flex:none}

/* shell */
.shell{display:grid;grid-template-columns:252px minmax(0,1fr);min-height:100vh}
.side{background:var(--nav);color:var(--nav-ink);position:sticky;top:0;height:100vh;height:100dvh;display:flex;flex-direction:column;padding:20px 14px;gap:18px;overflow-y:auto}
.logo{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:800;font-size:1.2rem;color:#fff;padding-inline:8px}
.logo-m{width:32px;height:32px;border-radius:9px;background:var(--accent);color:var(--on-accent);display:grid;place-items:center}
.ucard{display:flex;gap:10px;align-items:center;padding:10px;border-radius:10px;background:var(--nav-hover);border:1px solid var(--nav-line)}
.ucard .nm{color:#fff;font-weight:600;line-height:1.2}
.ucard .rl{font-size:12px;color:var(--nav-mute)}
.nav{display:flex;flex-direction:column;gap:3px}
.nv{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:9px;border:0;background:none;color:var(--nav-ink);cursor:pointer;font-weight:500;text-align:left;width:100%}
.nv:hover{background:var(--nav-hover)}
.nv[aria-current="page"]{background:var(--accent);color:var(--on-accent);font-weight:600}
.nv .bd{margin-left:auto;font-family:var(--mono);font-size:11.5px;background:var(--nav-line);color:#fff;border-radius:99px;padding:1px 8px}
.nv[aria-current="page"] .bd{background:rgba(255,255,255,.28);color:inherit}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:3px;border-top:1px solid var(--nav-line);padding-top:12px}
.side-foot .nv{font-size:13.5px;color:var(--nav-mute)}
.main{padding:24px clamp(16px,3vw,36px) 48px;min-width:0;max-width:1240px;width:100%}
.ph{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;margin-bottom:16px}
.ph p{margin:4px 0 0}
.statrow{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}
.st{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 14px;box-shadow:var(--shadow);display:flex;flex-direction:column;min-width:0}
.st .l{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.st .v{font-family:var(--display);font-weight:700;font-size:1.15rem}
.st .v.bad{color:var(--crit)}
@media (max-width:920px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .side{position:sticky;top:0;z-index:30;height:auto;flex-direction:row;flex-wrap:wrap;align-items:center;padding:10px 12px;gap:8px 10px}
  .ucard{display:none}
  .nav{flex-direction:row;overflow-x:auto;order:3;width:100%;padding-bottom:2px}
  .nv{width:auto;white-space:nowrap;padding:8px 12px}
  .side-foot{margin:0 0 0 auto;flex-direction:row;border:0;padding:0}
  .side-foot .nv{width:auto;padding:8px}
  .side-foot .nv span.t{display:none}
  .logo{padding-inline:0}
}

/* buttons */
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:8px 15px;cursor:pointer;font-weight:600;white-space:nowrap}
.btn:hover{background:var(--surface2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.danger{background:var(--crit);border-color:var(--crit);color:#fff}
.btn.ghost{background:transparent}
.btn.sm{padding:5px 11px;font-size:12.5px;border-radius:8px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.link{background:none;border:0;padding:0;cursor:pointer;font-weight:700;text-align:left;color:var(--ink)}
.link:hover{color:var(--accent);text-decoration:underline}
.iconbtn{position:relative;width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer;box-shadow:var(--shadow)}
.iconbtn .cnt{position:absolute;top:-6px;right:-6px;background:var(--crit);color:#fff;font-size:11px;font-weight:700;border-radius:99px;min-width:19px;height:19px;display:grid;place-items:center;padding-inline:4px}
.bellwrap{position:relative}
.pop{position:absolute;right:0;top:48px;width:min(360px,calc(100vw - 32px));background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 40px rgba(8,16,28,.25);z-index:35;overflow:hidden}
.pop h3{padding:12px 16px;border-bottom:1px solid var(--line)}
.al{display:flex;gap:12px;padding:12px 16px;border:0;border-top:1px solid var(--line);width:100%;background:none;text-align:left;cursor:pointer}
.pop h3+.al{border-top:0}
.al:hover{background:var(--surface2)}
.al .dot{width:9px;height:9px;border-radius:50%;margin-top:6px;flex:none}
.dot.crit{background:var(--crit)}.dot.warn{background:var(--low)}.dot.ok{background:var(--ok)}
.al b{display:block}

/* panels, pills */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}
.panel-h{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:14px 18px;border-bottom:1px solid var(--line)}
.panel-b{padding:18px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,360px),1fr));gap:16px;align-items:start}
.stack{display:flex;flex-direction:column;gap:16px}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.pill{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 14px;cursor:pointer;font-weight:500;font-size:13px}
.pill[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:600}
.pill .n{font-family:var(--mono);margin-left:6px;opacity:.8;font-size:12px}
.sbox{position:relative;flex:1 1 220px;max-width:340px;min-width:0}
.sbox .ic{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--muted)}
.search{width:100%;padding:9px 12px 9px 36px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.progress{height:10px;border-radius:99px;background:var(--surface2);border:1px solid var(--line);overflow:hidden}
.progress>i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .3s}
.chip{display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border-radius:99px;font-size:11.5px;font-weight:600;white-space:nowrap;background:var(--surface2);color:var(--muted);border:1px solid var(--line)}
.chip.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.chip.warn{background:var(--low-soft);color:var(--low);border-color:transparent}
.chip.fever{background:var(--fever-soft);color:var(--fever);border-color:transparent}
.chip.crit{background:var(--crit-soft);color:var(--crit);border-color:transparent}
.chip.acc{background:var(--accent-soft);color:var(--accent);border-color:transparent}

/* temperature grades */
.tp{font-family:var(--mono);font-weight:500;font-size:13.5px;padding:3px 9px;border-radius:7px;display:inline-block}
.g-ok{background:var(--ok-soft);color:var(--ok)}
.g-low{background:var(--low-soft);color:var(--low)}
.g-fever{background:var(--fever-soft);color:var(--fever)}
.g-crit{background:var(--crit);color:#fff}
.sp{display:block}
.sp.g-ok{color:var(--ok);background:none}.sp.g-low{color:var(--low);background:none}.sp.g-fever{color:var(--fever);background:none}.sp.g-crit{color:var(--crit);background:none}
.tr{font-weight:700;font-size:12px}
.tr.up{color:var(--crit)}.tr.dn{color:var(--ok)}

/* patient rows */
.row{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1.25fr) minmax(0,1.2fr) auto;align-items:center;gap:8px 18px;padding:13px 18px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row:hover{background:var(--surface2)}
.row.prio{box-shadow:inset 4px 0 0 var(--low)}
.row.critrow{box-shadow:inset 4px 0 0 var(--crit)}
.pn{display:flex;gap:11px;align-items:center;min-width:0}
.av{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;font-size:13px;flex:none;letter-spacing:.02em}
.pn .nm{min-width:0}
.pn .sub{font-size:12px;color:var(--muted)}
.rm{font-family:var(--mono);font-size:11.5px;background:var(--surface2);border:1px solid var(--line);border-radius:6px;padding:1px 6px;margin-right:6px;color:var(--muted)}
.tc{display:flex;flex-direction:column;gap:5px}
.tline{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.cs{display:flex;gap:5px;flex-wrap:wrap}
.ca{display:flex;gap:8px;align-items:center;justify-content:flex-end;flex-wrap:wrap}
.dots{display:inline-flex;gap:3px;margin-right:6px}
.dots i{width:9px;height:9px;border-radius:50%;border:1.5px solid var(--muted)}
.dots i.on{background:var(--ok);border-color:var(--ok)}
.done{font-size:12.5px;color:var(--ok);font-weight:700;display:inline-flex;align-items:center;gap:5px}
.qrec{display:flex;gap:6px;align-items:center}
.qin{width:5.2rem;padding:7px 9px;border:1.5px solid var(--line);border-radius:9px;background:var(--surface);font-family:var(--mono);font-size:14px;text-align:center}
.qin:focus{border-color:var(--accent);outline:0;box-shadow:0 0 0 3px var(--accent-soft)}
.qin.bad{border-color:var(--crit)}
.empty{padding:34px 18px;text-align:center;color:var(--muted)}
.empty .big{width:54px;height:54px;border-radius:50%;background:var(--ok-soft);color:var(--ok);display:grid;place-items:center;margin:0 auto 12px}
@media (max-width:820px){
  .row{grid-template-columns:minmax(0,1fr)!important}
  .ca{justify-content:flex-start}
}

/* kpis, banners */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,210px),1fr));gap:14px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px;box-shadow:var(--shadow)}
.kpi .l{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;font-weight:600}
.kpi .v{font-family:var(--display);font-size:2.1rem;font-weight:800;line-height:1.15}
.kpi .v small{font-size:1rem;font-weight:500;color:var(--muted)}
.kpi .s{font-size:12.5px;color:var(--muted)}
.banner{padding:14px 18px;border-radius:12px;display:flex;gap:14px;align-items:center;flex-wrap:wrap;justify-content:space-between;border:1px solid transparent}
.banner>div:first-child{flex:1 1 260px;min-width:0}
.banner b{display:block;font-family:var(--display);font-size:1.05rem}
.banner.bad{background:var(--crit-soft);color:var(--crit);border-color:var(--crit)}
.banner.good{background:var(--ok-soft);color:var(--ok)}
.banner.info{background:var(--low-soft);color:var(--low)}
.banner.acc{background:var(--accent-soft);color:var(--accent)}
.gauge{position:relative;height:16px;background:var(--surface2);border:1px solid var(--line);border-radius:8px;margin:28px 0 22px}
.gauge .fill{position:absolute;inset:0 auto 0 0;border-radius:7px}
.gauge .tick{position:absolute;top:-8px;bottom:-8px;width:2px;background:var(--ink)}
.gauge .tick span{position:absolute;top:-18px;transform:translateX(-50%);font-size:11px;font-family:var(--mono);white-space:nowrap}
.bignum{font-family:var(--display);font-weight:800;font-size:2.3rem;line-height:1}
.lbl{font-size:11.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.07em}
.issue{display:flex;gap:14px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.issue:first-child{border-top:0;padding-top:0}
.issue .num{font-family:var(--display);font-weight:800;font-size:1.5rem;min-width:2.6rem;text-align:right}
.chart-wrap{overflow-x:auto}
.wl{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.wl .nm{width:8.5rem;flex:none;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wl .bt{flex:1;height:12px;border-radius:6px;background:var(--surface2);border:1px solid var(--line);overflow:hidden}
.wl .bt i{display:block;height:100%;background:var(--accent)}
.wl .ct{font-family:var(--mono);font-size:12.5px;width:2.2rem;text-align:right}
.attn{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,250px),1fr));gap:12px;padding:16px 18px}
.ac{border:1px solid var(--crit);background:var(--crit-soft);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;min-width:0}
.ac .why{font-size:12.5px;color:var(--crit);font-weight:600}

/* rooms */
.beds{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:9px}
.bed{border:1px solid transparent;border-radius:10px;padding:7px 2px 6px;text-align:center;cursor:pointer;background:var(--accent-soft);font-family:var(--mono);font-size:12.5px;font-weight:500;display:flex;flex-direction:column;gap:2px;min-width:0;color:var(--ink)}
.bed:hover{transform:translateY(-1px);box-shadow:var(--shadow)}
.bed small{font-size:10.5px;font-family:var(--body);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-inline:3px}
.bed.fvr{background:var(--fever-soft)}
.bed.crt{background:var(--crit-soft);border-color:var(--crit)}
.bed.clr{background:var(--ok-soft);border-color:var(--ok)}
.bed.free{border:1px dashed var(--line);color:var(--muted);cursor:default;background:transparent}
.bed.free:hover{transform:none;box-shadow:none}
.legend{display:flex;flex-wrap:wrap;gap:16px;font-size:12px;color:var(--muted);margin-top:16px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:4px;margin-right:6px;vertical-align:-2px;border:1px solid var(--line)}

/* forms & modals */
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:14px;min-width:0}
.field label{font-size:11.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.field input,.field select,.field textarea{padding:10px 12px;border:1px solid var(--line);border-radius:9px;background:var(--surface);width:100%;min-width:0}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent);outline:0;box-shadow:0 0 0 3px var(--accent-soft)}
.field textarea{min-height:84px;resize:vertical}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,170px),1fr));gap:14px}
.temp-in{font-family:var(--display);font-size:2.4rem;font-weight:700;max-width:10rem}
.hint{font-size:13.5px;font-weight:700;min-height:1.5em}
.err{color:var(--crit);font-size:13px;min-height:1.3em;font-weight:600}
.choice{display:flex;gap:11px;padding:12px 14px;border:1px solid var(--line);border-radius:11px;margin-bottom:9px;cursor:pointer;align-items:flex-start}
.choice:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.choice input{margin-top:4px;accent-color:var(--accent)}
.choice.dis{opacity:.55;cursor:not-allowed}
.scrim{position:fixed;inset:0;background:rgba(6,12,20,.6);z-index:50;display:flex;align-items:center;justify-content:center;padding:16px;backdrop-filter:blur(2px)}
.scrim.right{justify-content:flex-end;padding:0}
.modal{background:var(--surface);color:var(--ink);border-radius:16px;width:min(540px,100%);max-height:calc(100% - 8px);overflow:auto;padding:22px;border:1px solid var(--line);box-shadow:0 24px 60px rgba(0,0,0,.35)}
.drawer{background:var(--surface);color:var(--ink);width:min(580px,100%);height:100%;overflow:auto;padding:22px;border-left:1px solid var(--line)}
.mh{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;margin-bottom:14px}
.mf{display:flex;gap:9px;justify-content:flex-end;flex-wrap:wrap;margin-top:10px}
.who-card{background:var(--surface2);border:1px solid var(--line);border-radius:11px;padding:11px 14px;margin-bottom:14px;display:flex;gap:11px;align-items:center}
.tl{list-style:none;margin:0;padding:0}
.tl li{display:flex;gap:14px;padding:9px 0;border-top:1px solid var(--line);font-size:13px}
.tl li:first-child{border-top:0}
.tl .tm{font-family:var(--mono);font-size:12px;color:var(--muted);min-width:7.8rem;flex:none}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:24px;background:var(--ink);color:var(--bg);padding:11px 20px;border-radius:11px;z-index:80;font-weight:600;max-width:calc(100% - 32px);box-shadow:0 10px 30px rgba(0,0,0,.3)}

/* login */
.lg{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);min-height:100vh}
.hero{background:linear-gradient(160deg,#0F1B2D 0%,#12303B 60%,#0E5252 100%);color:#fff;padding:clamp(28px,5vw,64px);display:flex;flex-direction:column;gap:22px;justify-content:center;position:relative;overflow:hidden}
.hero h1{font-size:clamp(2rem,4.2vw,3.1rem);line-height:1.05;max-width:14ch}
.hero p{color:#B9C8DC;max-width:44ch;margin:0;font-size:15.5px}
.facts{display:flex;gap:26px;flex-wrap:wrap;margin-top:6px}
.facts b{display:block;font-family:var(--display);font-size:1.7rem;color:#6FE0D9}
.facts span{font-size:12.5px;color:#9FB2CA}
.trace{position:absolute;left:0;right:0;bottom:24px;opacity:.35}
.pick{padding:clamp(24px,4vw,56px);display:flex;flex-direction:column;justify-content:center;gap:18px}
.roles{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:14px}
.role{text-align:left;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:16px;padding:18px;cursor:pointer;display:flex;flex-direction:column;gap:7px;min-width:0;box-shadow:var(--shadow);border-top:4px solid var(--rc)}
.role:hover{transform:translateY(-2px);border-color:var(--rc)}
.role .ri{width:40px;height:40px;border-radius:11px;background:var(--rs);color:var(--rc);display:grid;place-items:center}
.role .t{font-family:var(--display);font-weight:700;font-size:1.15rem}
.role .live{margin-top:auto;padding-top:10px;font-family:var(--mono);font-size:12.5px;color:var(--rc);font-weight:500}
@media (max-width:860px){.lg{grid-template-columns:minmax(0,1fr)}.hero{padding-bottom:80px}}
@media (prefers-reduced-motion:no-preference){.modal,.drawer{animation:in .18s ease-out}.role,.bed{transition:transform .15s,box-shadow .15s}@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}}
</style>
</head>
<body>
<div id="app"></div>
<div id="modal-root"></div>
<div id="toast-root"></div>

<script>
/* ============ constants & helpers ============ */
const FEVER=38.0, CRIT=39.5, BENCH=0.15, CAP=74, DAY=864e5, HR=36e5, STORE='quarantineround.v2';
const USERS={
  nurse:{name:'Priya Nair',first:'Priya',title:'Staff Nurse',icon:'thermo',blurb:'Record daily temperatures and see who is still missing.'},
  doctor:{name:'Dr. Arjun Mehta',first:'Dr. Mehta',title:'Doctor',icon:'steth',blurb:'See who is ready, record visits and clear patients for discharge.'},
  admin:{name:'Kavita Rao',first:'Kavita',title:'Admin Staff',icon:'grid',blurb:'Register patients, manage 74 rooms and record discharges.'},
  head:{name:'Dr. Sunita Iyer',first:'Dr. Iyer',title:'Head Doctor',icon:'chart',blurb:'Monitor operations and mortality against the 15% benchmark.'}
};
const NURSES=['Priya Nair','Rahul Kamat','Fatima Sheikh','Joseph D\u2019Souza'];
const DOCTORS=['Dr. Arjun Mehta','Dr. Leena Kulkarni','Dr. Samir Qureshi'];
const TREATMENTS=['Observation only','Antipyretic + oral fluids','IV fluids + antipyretic','Antiviral course (day 1\u20135)','Oxygen support + antiviral'];
const IC={
  pulse:'<path d="M2 12h4l2.5-6 4 12 2.5-6H22"/>',
  clip:'<path d="M9 3h6a1 1 0 0 1 1 1v2H8V4a1 1 0 0 1 1-1z"/><path d="M8 5H6a1 1 0 0 0-1 1v14a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V6a1 1 0 0 0-1-1h-2"/><path d="M9 14l2 2 4-4"/>',
  grid:'<rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/>',
  userplus:'<circle cx="9" cy="8" r="4"/><path d="M2 21a7 7 0 0 1 14 0M19 8v6M16 11h6"/>',
  exit:'<path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/>',
  chart:'<path d="M3 3v18h18"/><path d="M7 15l4-5 3 3 5-7"/>',
  users:'<circle cx="9" cy="8" r="3.5"/><path d="M2 20a7 7 0 0 1 14 0"/><circle cx="17" cy="9" r="2.5"/><path d="M17 14a5 5 0 0 1 5 5"/>',
  clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
  bell:'<path d="M6 8a6 6 0 0 1 12 0c0 7 3 8 3 8H3s3-1 3-8M10 21a2 2 0 0 0 4 0"/>',
  sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',
  moon:'<path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8z"/>',
  check:'<path d="M5 12l5 5L20 7"/>',
  alert:'<path d="M12 3l10 18H2L12 3zM12 10v5M12 18h.01"/>',
  search:'<circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/>',
  reset:'<path d="M3 12a9 9 0 1 0 3-6.7L3 8M3 3v5h5"/>',
  down:'<path d="M12 3v12M6 11l6 6 6-6M4 21h16"/>',
  thermo:'<path d="M14 14.8V5a2 2 0 0 0-4 0v9.8a4 4 0 1 0 4 0z"/>',
  steth:'<path d="M5 3v6a4 4 0 0 0 8 0V3M9 13v2a5 5 0 0 0 10 0v-1"/><circle cx="19" cy="12" r="2"/>',
  bed:'<path d="M3 18V6M3 14h18v4M21 14v-2a3 3 0 0 0-3-3h-7v5"/><circle cx="7" cy="11" r="1.6"/>',
  door:'<path d="M6 21V4a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v17M3 21h18M14 12h.01"/>'
};
const ico=(n,s=18)=>`<svg class="ic" width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${IC[n]||''}</svg>`;
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const p2=n=>String(n).padStart(2,'0');
const dayKey=ts=>{const d=new Date(ts);return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate())};
const offKey=o=>{const d=new Date();d.setDate(d.getDate()-o);return dayKey(d)};
const isToday=ts=>dayKey(ts)===dayKey(Date.now());
const fmtT=ts=>{const d=new Date(ts);return p2(d.getHours())+':'+p2(d.getMinutes())};
const fmtD=ts=>new Date(ts).toLocaleDateString('en-IN',{day:'numeric',month:'short'});
const fmtDT=ts=>(isToday(ts)?'Today':fmtD(ts))+' '+fmtT(ts);
const dayDiff=ts=>Math.round((new Date(dayKey(Date.now())+'T00:00:00')-new Date(dayKey(ts)+'T00:00:00'))/DAY);
const relDay=ts=>{const d=dayDiff(ts);return d===0?'today':d===1?'yesterday':d+'d ago'};
const roomLbl=n=>'R'+p2(n);
const pct=x=>(x*100).toFixed(1)+'%';
const hrsTxt=ms=>{const h=ms/HR;return h<1?Math.round(h*60)+' min':h<48?h.toFixed(h<10?1:0)+' h':Math.round(h/24)+' d'};
const grade=t=>t>=CRIT?'crit':t>=FEVER?'fever':t>=37.5?'low':'ok';
const gradeLbl={ok:'Normal',low:'Low-grade',fever:'Fever',crit:'Critical'};
const gradeChip={ok:'ok',low:'warn',fever:'fever',crit:'crit'};
const initials=n=>n.split(' ').filter(Boolean).slice(0,2).map(w=>w[0]).join('').toUpperCase();
const hue=n=>{let h=0;for(const c of n)h=(h*31+c.charCodeAt(0))%360;return h};
const avatar=(n,s)=>`<span class="av" style="background:hsl(${hue(n)} 48% 42%);${s?`width:${s}px;height:${s}px;font-size:${Math.round(s/3)}px`:''}">${esc(initials(n))}</span>`;

/* ============ data ============ */
let DB,S={role:null,tab:null,filter:null,search:'',bell:false};

function seed(){
  const now=Date.now(); let s=11;
  const rnd=()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
  const ri=(a,b)=>a+Math.floor(rnd()*(b-a+1));
  const pick=a=>a[Math.floor(rnd()*a.length)];
  const atDay=(o,h,m)=>{const d=new Date(now);d.setDate(d.getDate()-o);d.setHours(h,m,0,0);return d.getTime()};
  const FN=['Aarav','Ishaan','Vihaan','Rohan','Kabir','Arjun','Sameer','Neha','Ananya','Diya','Meera','Isha','Priya','Sana','Farhan','Imran','Zoya','Kiran','Rahul','Manish','Deepa','Lakshmi','Suresh','Ramesh','Anil','Sunita','Pooja','Nikhil','Tanvi','Varun','Harsh','Riya','Aditi','Mohan','Geeta','Rekha','Vikram','Sanjay','Anjali','Naveen'];
  const LN=['Sharma','Patil','Deshmukh','Khan','Iyer','Nair','Reddy','Gupta','Joshi','Kulkarni','Shah','Mehta','Singh','Das','Banerjee','Pillai','Menon','Chopra','Verma','Fernandes','D\u2019Souza','Shaikh','Kapoor'];
  const clearedAt={4:2,19:5,33:9,48:20,62:31};
  const dupSet=[3,12,27,41];let earlyN=0;
  const patients=[];
  for(let i=0;i<CAP;i++){
    const cl=i in clearedAt;
    let k; const r=rnd();
    if(cl) k=ri(4,6); else k=r<.35?0:r<.55?1:r<.70?2:ri(3,6);
    const todayPresent=cl||rnd()<.58;
    const a=Math.min(14,Math.max(k+1,2)+ri(0,6));
    const readings=[],visits=[];
    for(let o=a;o>=0;o--){
      if(o===0&&!todayPresent) continue;
      if(o>0&&o>=k&&rnd()<.06) continue;
      const temp=o<k?+(36.4+rnd()).toFixed(1):+Math.min(40.2,38.2+rnd()*1.6).toFixed(1);
      const ts=o===0?Math.min(now-ri(5,60)*6e4,atDay(0,ri(7,10),ri(0,59))):atDay(o,ri(7,10),ri(0,59));
      readings.push({ts,temp,nurse:pick(NURSES),recheck:false});
    }
    if(dupSet.includes(i)&&todayPresent){
      const f=readings[readings.length-1];
      readings.push({ts:Math.min(f.ts+ri(40,120)*6e4,now-6e4),temp:+(f.temp+(rnd()-.5)*.4).toFixed(1),nurse:pick(NURSES.filter(n=>n!==f.nurse)),recheck:false});
    }
    const seen={};
    readings.forEach(rd=>{
      const key=dayKey(rd.ts); if(seen[key]) return; seen[key]=1;
      const old=!isToday(rd.ts);
      if(old?rnd()<.85:rnd()<.45){
        const v=Math.min(rd.ts+ri(30,150)*6e4,now-6e4);
        visits.push({ts:v,doctor:pick(DOCTORS),notes:rd.temp>=FEVER?pick(['Persistent fever, hydration encouraged.','Fever trending down slowly.','Mild cough, SpO2 stable.','Continue current plan.']):pick(['Afebrile, comfortable.','Appetite improving.','No new symptoms.']),treatment:rd.temp>=FEVER?pick(TREATMENTS.slice(1)):TREATMENTS[0],decision:'continue',tempSeen:true});
      }
    });
    if(!todayPresent&&(rnd()<.07||(earlyN<3&&i>20&&rnd()<.4))){earlyN++;visits.push({ts:Math.min(atDay(0,ri(9,11),ri(0,59)),now-6e4),doctor:pick(DOCTORS),notes:'Measured temperature during visit (no nurse reading yet).',treatment:'Observation only',decision:'continue',tempSeen:false})}
    let status='admitted',cAt=null;
    if(cl){status='cleared';cAt=now-clearedAt[i]*HR;visits.push({ts:cAt,doctor:pick(DOCTORS),notes:'Afebrile for 3 full days. Cleared for discharge.',treatment:'Observation only',decision:'clear',tempSeen:true})}
    readings.sort((x,y)=>x.ts-y.ts); visits.sort((x,y)=>x.ts-y.ts);
    patients.push({id:'QF-'+(1000+i),name:FN[i%40]+' '+LN[(i*7+3)%23],age:ri(19,81),sex:i%2?'F':'M',room:i+1,phone:'+91 9'+ri(10000,99999)+ri(10000,99999),admittedAt:atDay(a,ri(8,18),ri(0,59)),status,clearedAt:cAt,outcomeAt:null,priority:!todayPresent&&visits.length===0&&rnd()<.12,readings,visits});
  }
  const oc=[];for(let j=0;j<56;j++)oc.push(j<10?'deceased':'discharged');
  for(let j=oc.length-1;j>0;j--){const q=Math.floor(rnd()*(j+1));[oc[j],oc[q]]=[oc[q],oc[j]]}
  const archive=oc.map((o,j)=>{const at=now-rnd()*14*DAY-HR;return{id:'QF-'+(900+j),outcome:o,outcomeAt:at,clearedAt:o==='discharged'?at-ri(1,36)*HR:null}});
  const log=[];
  patients.filter(p=>p.status==='cleared').forEach(p=>log.push({ts:p.clearedAt,who:p.visits[p.visits.length-1].doctor,text:'cleared '+p.name+' ('+p.id+') for discharge'}));
  log.push({ts:now-26*6e4,who:'Rahul Kamat',text:'recorded temperature for '+patients[10].name+' ('+patients[10].id+')'});
  log.sort((x,y)=>y.ts-x.ts);
  const waitlist=[
    {id:'WL-1',name:'Mahesh Bhat',age:58,sex:'M',phone:'+91 98200 11452',urgent:true,addedAt:now-25*6e4},
    {id:'WL-2',name:'Sneha Rane',age:34,sex:'F',phone:'+91 98330 22871',urgent:false,addedAt:now-70*6e4},
    {id:'WL-3',name:'Imtiyaz Ansari',age:47,sex:'M',phone:'+91 99670 40118',urgent:false,addedAt:now-120*6e4},
    {id:'WL-4',name:'Pallavi More',age:29,sex:'F',phone:'+91 97690 83355',urgent:true,addedAt:now-170*6e4}
  ];
  return{seedDay:dayKey(now),nextId:1075,nextWL:5,patients,archive,log,waitlist};
}
function save(){try{localStorage.setItem(STORE,JSON.stringify(DB))}catch(e){}}
function load(){
  try{const r=localStorage.getItem(STORE);if(r){const d=JSON.parse(r);if(d&&d.seedDay===dayKey(Date.now())){DB=d;return}}}catch(e){}
  DB=seed();save();
}

/* ============ derived ============ */
const active=()=>DB.patients.filter(p=>p.status==='admitted'||p.status==='cleared').sort((a,b)=>a.room-b.room);
const todays=p=>p.readings.filter(r=>isToday(r.ts));
const visitsToday=p=>p.visits.filter(v=>isToday(v.ts));
function dailyMax(p){const m={};p.readings.forEach(r=>{const k=dayKey(r.ts);m[k]=Math.max(m[k]??-1,r.temp)});return m}
const dailyList=p=>Object.entries(dailyMax(p)).sort((a,b)=>a[0]<b[0]?-1:1).map(e=>e[1]);
function streak(p){
  const m=dailyMax(p),todayDone=dayKey(Date.now()) in m;
  let o=todayDone?0:1,n=0;
  while(true){const k=offKey(o);if(k in m&&m[k]<FEVER){n++;o++}else break}
  return{n,todayDone};
}
const eligible=p=>{if(p.status!=='admitted')return false;const s=streak(p);return s.todayDone&&s.n>=3};
function trend(p){const l=dailyList(p);if(l.length<2)return 0;const d=l[l.length-1]-l[l.length-2];return d>=.3?1:d<=-.3?-1:0}
function attention(p){
  if(p.status!=='admitted')return[];
  const r=[],last=p.readings[p.readings.length-1],l=dailyList(p);
  if(last&&isToday(last.ts)&&last.temp>=CRIT)r.push('Critical temperature '+last.temp.toFixed(1)+'\u00B0C');
  if(l.length>=2&&l[l.length-1]>=FEVER&&l[l.length-1]-l[l.length-2]>=.6)r.push('Fever rising');
  let fd=0;for(let i=l.length-1;i>=0&&l[i]>=FEVER;i--)fd++;
  if(fd>=8)r.push('Fever for '+fd+' days');
  return r;
}
function metrics(){
  const act=active();
  const closed=DB.archive.map(a=>({outcome:a.outcome,at:a.outcomeAt,clearedAt:a.clearedAt}))
    .concat(DB.patients.filter(p=>p.status==='discharged'||p.status==='deceased').map(p=>({outcome:p.status,at:p.outcomeAt,clearedAt:p.clearedAt})));
  const deaths=closed.filter(c=>c.outcome==='deceased').length, disch=closed.filter(c=>c.outcome==='discharged').length;
  const tot=deaths+disch, rate=tot?deaths/tot:0;
  const wk=closed.filter(c=>c.at>Date.now()-7*DAY), wd=wk.filter(c=>c.outcome==='deceased').length;
  const wrate=wk.length?wd/wk.length:0;
  const delays=closed.filter(c=>c.outcome==='discharged'&&c.clearedAt).map(c=>c.at-c.clearedAt);
  const avgDelay=delays.length?delays.reduce((a,b)=>a+b,0)/delays.length:0;
  const tempDone=act.filter(p=>todays(p).length).length;
  const visitDone=act.filter(p=>visitsToday(p).length).length;
  const waiting=act.filter(p=>p.status==='cleared');
  const dupes=act.reduce((n,p)=>n+Math.max(0,todays(p).filter(r=>!r.recheck).length-1),0);
  const early=act.filter(p=>visitsToday(p).some(v=>!v.tempSeen)).length;
  const longWait=waiting.filter(p=>Date.now()-p.clearedAt>6*HR).length;
  const attn=act.filter(p=>attention(p).length);
  const ready=act.filter(p=>p.status==='admitted'&&todays(p).length&&!visitsToday(p).length);
  const elig=act.filter(eligible);
  return{act,deaths,disch,tot,rate,wk:wk.length,wrate,avgDelay,tempDone,visitDone,waiting,dupes,early,longWait,closed,attn,ready,elig,free:CAP-act.length};
}
function addLog(who,text){DB.log.unshift({ts:Date.now(),who,text});DB.log=DB.log.slice(0,80)}
const P=id=>DB.patients.find(p=>p.id===id);
const isDark=()=>{const t=document.documentElement.dataset.theme;return t?t==='dark':!!(window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches)};

/* ============ data actions ============ */
function recordTemp(id,temp,recheck,reason){
  const p=P(id),u=USERS.nurse.name;
  p.readings.push({ts:Date.now(),temp,nurse:u,recheck:!!recheck,reason:reason||''});
  p.priority=false;
  addLog(u,(recheck?'re-checked ':'recorded temperature for ')+p.name+' ('+p.id+') '+temp.toFixed(1)+'\u00B0C');
  save();
}
function recordVisit(id,f){
  const p=P(id),u=USERS.doctor.name;
  const tempSeen=todays(p).length>0;
  p.visits.push({ts:Date.now(),doctor:u,notes:f.notes,treatment:f.treatment,decision:f.decision,tempSeen});
  if(f.decision==='clear'){p.status='cleared';p.clearedAt=Date.now();addLog(u,'cleared '+p.name+' ('+p.id+') for discharge')}
  else if(f.decision==='death'){p.status='deceased';p.outcomeAt=Date.now();addLog(u,'recorded death of '+p.name+' ('+p.id+'), room '+roomLbl(p.room)+' released')}
  else addLog(u,'visited '+p.name+' ('+p.id+')');
  save();
}
const freeRooms=()=>{const occ=new Set(active().map(p=>p.room)),f=[];for(let r=1;r<=CAP;r++)if(!occ.has(r))f.push(r);return f};
const sortedWL=()=>[...DB.waitlist].sort((a,b)=>(b.urgent-a.urgent)||a.addedAt-b.addedAt);

/* ============ view pieces ============ */
const chip=(c,t)=>`<span class="chip ${c}">${t}</span>`;
const dots=n=>`<span class="dots">${[0,1,2].map(i=>`<i class="${i<n?'on':''}"></i>`).join('')}</span>`;
function spark(p){
  const l=dailyList(p).slice(-7);if(l.length<2)return '';
  const W=70,H=24,lo=36,hi=40.5,y=v=>H-2-((Math.min(hi,Math.max(lo,v))-lo)/(hi-lo))*(H-4);
  const x=i=>2+i*(W-4)/(l.length-1);
  const pts=l.map((v,i)=>x(i)+','+y(v)).join(' ');
  const g=grade(l[l.length-1]);
  return `<svg class="sp g-${g}" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" aria-hidden="true"><line x1="0" x2="${W}" y1="${y(FEVER)}" y2="${y(FEVER)}" stroke="currentColor" stroke-opacity=".3" stroke-dasharray="3 3"/><polyline points="${pts}" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/><circle cx="${x(l.length-1)}" cy="${y(l[l.length-1])}" r="2.8" fill="currentColor"/></svg>`;
}
function patientRow(p,role){
  const t=todays(p),sk=streak(p),last=p.readings[p.readings.length-1],vt=visitsToday(p);
  const tDone=t.length>0,at=attention(p),el=eligible(p);
  const g=last?grade(last.temp):'ok',tr=trend(p);
  const tline=last?`<div class="tline"><span class="tp g-${g}">${last.temp.toFixed(1)}\u00B0</span>${tr?`<span class="tr ${tr>0?'up':'dn'}" title="${tr>0?'Rising':'Falling'} vs previous day">${tr>0?'\u25B2':'\u25BC'}</span>`:''}<span class="muted small">${isToday(last.ts)?'today '+fmtT(last.ts):relDay(last.ts)}</span>${spark(p)}</div>`:'<div class="tline muted">No readings yet</div>';
  let chips='';
  chips+=tDone?chip('ok','Temp '+fmtT(t[0].ts)):chip(p.priority?'warn':'','Temp pending');
  chips+=vt.length?chip('ok','Seen '+fmtT(vt[vt.length-1].ts)):chip('','Visit pending');
  if(p.priority&&!tDone)chips+=chip('warn','Doctor waiting');
  if(p.status==='cleared')chips+=chip('acc','Cleared \u00B7 awaiting discharge');
  else if(el)chips+=chip('ok','Eligible');
  if(at.length&&role!=='nurse')chips+=chip('crit',esc(at[0]));
  let act='';
  if(role==='nurse'){
    act=tDone?`<span class="done">${ico('check',15)}Recorded ${fmtT(t[t.length-1].ts)}</span><button class="btn ghost sm" data-action="recheck" data-id="${p.id}">Re-check</button>`
      :`<div class="qrec"><input class="qin" id="q_${p.id}" data-q="${p.id}" type="number" step="0.1" min="34" max="42" inputmode="decimal" placeholder="36.8" aria-label="Temperature for ${esc(p.name)}"><button class="btn primary sm" data-action="qsave" data-id="${p.id}">Save</button></div>`;
  }else if(role==='doctor'){
    if(p.status==='cleared')act=`<span class="done">${ico('check',15)}Cleared ${fmtT(p.clearedAt)}</span>`;
    else if(vt.length)act=`<span class="done">${ico('check',15)}Seen ${fmtT(vt[vt.length-1].ts)}</span><button class="btn ghost sm" data-action="visit" data-id="${p.id}">Add note</button>`;
    else if(tDone)act=`<button class="btn primary" data-action="visit" data-id="${p.id}">Visit</button>`;
    else act=p.priority?`<button class="btn sm" disabled>Reading requested</button>`:`<button class="btn sm" data-action="request" data-id="${p.id}">Request reading</button>`;
  }
  const cls=at.length&&role!=='nurse'?'critrow':(p.priority&&!tDone&&role==='nurse'?'prio':'');
  return `<div class="row ${cls}">
    <div class="pn">${avatar(p.name)}<div class="nm"><button class="link" data-action="open" data-id="${p.id}">${esc(p.name)}</button><div class="sub"><span class="rm">${roomLbl(p.room)}</span>${p.id} \u00B7 ${p.age}${p.sex} \u00B7 Day ${dayDiff(p.admittedAt)+1}</div></div></div>
    <div class="tc">${tline}<div class="small muted">${dots(Math.min(sk.n,3))}${Math.min(sk.n,3)}/3 afebrile days</div></div>
    <div class="cs">${chips}</div>
    <div class="ca">${act}</div>
  </div>`;
}
function listMatch(p){
  const q=S.search.trim().toLowerCase();if(!q)return true;
  return p.name.toLowerCase().includes(q)||p.id.toLowerCase().includes(q)||String(p.room)===q||roomLbl(p.room).toLowerCase()===q;
}
function pills(defs){return `<div class="pills">${defs.map(d=>`<button class="pill" aria-pressed="${S.filter===d.k}" data-action="filter" data-k="${d.k}">${d.l}<span class="n">${d.n}</span></button>`).join('')}</div>`}
const searchBox=()=>`<div class="sbox">${ico('search',16)}<input class="search" id="search" type="search" placeholder="Search name, ID or room" value="${esc(S.search)}" aria-label="Search patients"></div>`;
const rowsOrEmpty=(list,role,msg)=>list.length?list.map(p=>patientRow(p,role)).join(''):`<div class="empty">${msg}</div>`;

/* ============ alerts (bell) ============ */
function alertsFor(role,m){
  const a=[];
  if(role==='nurse'){
    const pr=m.act.filter(p=>p.priority&&!todays(p).length).length,pend=m.act.length-m.tempDone;
    if(pr)a.push({sev:'warn',t:pr+' doctor request'+(pr>1?'s':''),x:'A doctor is waiting on these readings. They are at the top of your list.',k:'rounds'});
    if(pend)a.push({sev:'warn',t:pend+' readings still pending',x:'Round is '+Math.round(m.tempDone/m.act.length*100)+'% complete.',k:'rounds'});
    const cr=m.act.filter(p=>{const t=todays(p);return t.length&&t[t.length-1].temp>=CRIT}).length;
    if(cr)a.push({sev:'crit',t:cr+' critical reading'+(cr>1?'s':'')+' today',x:'Make sure the doctor on duty has seen them.',k:'rounds'});
  }
  if(role==='doctor'){
    if(m.attn.length)a.push({sev:'crit',t:m.attn.length+' patients need attention',x:m.attn.slice(0,2).map(p=>p.name).join(', ')+(m.attn.length>2?' and more':''),k:'rounds',f:'attn'});
    if(m.ready.length)a.push({sev:'warn',t:m.ready.length+' ready to see',x:'Reading is in, no visit yet.',k:'rounds',f:'ready'});
    if(m.elig.length)a.push({sev:'ok',t:m.elig.length+' eligible for discharge',x:'3 afebrile days confirmed. Clear them so admin can act.',k:'discharge'});
  }
  if(role==='admin'){
    if(m.longWait)a.push({sev:'crit',t:m.longWait+' cleared patient'+(m.longWait>1?'s':'')+' waiting over 6 h',x:'Record the discharge to free the room.',k:'discharge'});
    else if(m.waiting.length)a.push({sev:'warn',t:m.waiting.length+' awaiting discharge',x:'Cleared by doctors.',k:'discharge'});
    if(DB.waitlist.length)a.push({sev:'warn',t:DB.waitlist.length+' on the waiting list',x:m.free?m.free+' room'+(m.free>1?'s':'')+' free. Admit the next patient.':'Facility is full. Rooms free up as patients are discharged.',k:'admit'});
  }
  if(role==='head'){
    if(m.rate>BENCH)a.push({sev:'crit',t:'Mortality '+pct(m.rate)+' is above 15%',x:'Review the attention list and recent outcomes.',k:'overview'});
    if(m.attn.length)a.push({sev:'warn',t:m.attn.length+' patients flagged',x:'Critical or rising fevers.',k:'overview'});
    if(m.longWait)a.push({sev:'warn',t:m.longWait+' discharge delays over 6 h',x:'Cleared patients still holding a room.',k:'overview'});
  }
  return a;
}
function bellHTML(role,m){
  const a=alertsFor(role,m);
  return `<div class="bellwrap"><button class="iconbtn" data-action="bell" aria-label="Alerts" aria-expanded="${S.bell}">${ico('bell',19)}${a.length?`<span class="cnt">${a.length}</span>`:''}</button>
  ${S.bell?`<div class="pop"><h3>Alerts</h3>${a.length?a.map(x=>`<button class="al" data-action="goto" data-k="${x.k}" data-f="${x.f||''}"><span class="dot ${x.sev==='crit'?'crit':x.sev==='ok'?'ok':'warn'}"></span><span><b>${esc(x.t)}</b><span class="muted small">${esc(x.x)}</span></span></button>`).join(''):'<div class="empty">Nothing needs attention right now.</div>'}</div>`:''}</div>`;
}

/* ============ role views ============ */
function nurseView(m){
  const act=m.act,pend=act.filter(p=>!todays(p).length),done=act.filter(p=>todays(p).length);
  S.filter=S.filter||'pending';
  let list=S.filter==='pending'?pend:S.filter==='done'?done:act;
  list=list.filter(listMatch).sort((a,b)=>(b.priority&&!todays(b).length)-(a.priority&&!todays(a).length)||a.room-b.room);
  const w=act.length?Math.round(done.length/act.length*100):0;
  const complete=!pend.length;
  return `<div class="stack">
    <div class="panel"><div class="panel-b">
      <div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:10px;align-items:baseline"><h3>Today\u2019s temperature round</h3><span class="mono"><b>${done.length}</b> of ${act.length} recorded \u00B7 ${w}%</span></div>
      <div class="progress"><i style="width:${w}%"></i></div>
      <div class="muted small" style="margin-top:10px">${complete?'Every patient has a reading today.':'Type a temperature and press Enter to save it and jump to the next patient. Recorded patients show a green tick, so nobody is measured twice.'}</div>
    </div></div>
    <div class="bar">${pills([{k:'pending',l:'Pending',n:pend.length},{k:'done',l:'Recorded',n:done.length},{k:'all',l:'All patients',n:act.length}])}${searchBox()}</div>
    ${complete&&S.filter==='pending'&&!S.search?`<div class="panel"><div class="empty"><div class="big">${ico('check',28)}</div><h3 style="color:var(--ink)">Round complete</h3><p>All ${act.length} patients have a reading for today. Doctors can now visit anyone.</p></div></div>`:`<div class="panel">${rowsOrEmpty(list,'nurse','No patients match.')}</div>`}
  </div>`;
}
function attnPanel(m){
  if(!m.attn.length)return '';
  const top=m.attn.slice(0,4);
  return `<div class="panel" style="border-color:var(--crit)"><div class="panel-h"><h3 style="color:var(--crit);display:flex;gap:8px;align-items:center">${ico('alert',18)}Needs attention (${m.attn.length})</h3>${S.role==='doctor'?'<button class="btn sm" data-action="filter" data-k="attn">View all</button>':''}</div>
  <div class="attn">${top.map(p=>{const last=p.readings[p.readings.length-1];return `<div class="ac"><div class="pn">${avatar(p.name,34)}<div class="nm"><button class="link" data-action="open" data-id="${p.id}">${esc(p.name)}</button><div class="sub">${roomLbl(p.room)} \u00B7 ${p.age}${p.sex}</div></div></div><div class="tline"><span class="tp g-${grade(last.temp)}">${last.temp.toFixed(1)}\u00B0</span>${spark(p)}</div><div class="why">${esc(attention(p).join(' \u00B7 '))}</div></div>`}).join('')}</div></div>`;
}
function doctorView(m){
  if(S.tab==='discharge')return doctorDischarge(m);
  const act=m.act;
  const ready=m.ready,wait=act.filter(p=>p.status==='admitted'&&!todays(p).length&&!visitsToday(p).length),seen=act.filter(p=>visitsToday(p).length);
  S.filter=S.filter||'ready';
  let list=S.filter==='ready'?ready:S.filter==='wait'?wait:S.filter==='seen'?seen:S.filter==='attn'?m.attn:act;
  list=list.filter(listMatch).sort((a,b)=>(attention(b).length>0)-(attention(a).length>0)||a.room-b.room);
  return `<div class="stack">
    ${S.filter==='attn'?'':attnPanel(m)}
    <div class="kpis">
      <div class="kpi"><div class="l">Ready to see</div><div class="v">${ready.length}</div><div class="s">Reading is in, no visit yet</div></div>
      <div class="kpi"><div class="l">Waiting on reading</div><div class="v">${wait.length}</div><div class="s">Skip until the nurse records</div></div>
      <div class="kpi"><div class="l">Seen today</div><div class="v">${seen.length}<small> / ${act.length}</small></div><div class="s">${act.length?Math.round(seen.length/act.length*100):0}% of patients</div></div>
      <div class="kpi"><div class="l">Eligible to clear</div><div class="v">${m.elig.length}</div><div class="s">3 afebrile days confirmed</div></div>
    </div>
    <div class="bar">${pills([{k:'ready',l:'Ready to see',n:ready.length},{k:'wait',l:'Waiting on reading',n:wait.length},{k:'seen',l:'Seen today',n:seen.length},{k:'attn',l:'Needs attention',n:m.attn.length},{k:'all',l:'All',n:act.length}])}${searchBox()}</div>
    <div class="panel">${rowsOrEmpty(list,'doctor','Nothing here right now.')}</div>
  </div>`;
}
function doctorDischarge(m){
  const el=m.elig,near=m.act.filter(p=>{if(p.status!=='admitted'||eligible(p))return false;return streak(p).n>=2});
  const row=(p,btn)=>{const s=streak(p);return `<div class="row" style="grid-template-columns:minmax(0,1.5fr) minmax(0,1.5fr) auto">
    <div class="pn">${avatar(p.name)}<div class="nm"><button class="link" data-action="open" data-id="${p.id}">${esc(p.name)}</button><div class="sub"><span class="rm">${roomLbl(p.room)}</span>${p.id} \u00B7 Day ${dayDiff(p.admittedAt)+1}</div></div></div>
    <div class="tc"><div>${dots(Math.min(s.n,3))}<b class="mono">${Math.min(s.n,3)}/3</b> afebrile days</div><div class="small muted">${s.todayDone?'Today\u2019s reading recorded':'Today\u2019s reading still missing'}</div></div>
    <div class="ca">${btn}</div></div>`};
  return `<div class="stack">
    <div class="banner info"><div><b>How eligibility works</b>A patient is eligible after 3 consecutive days with every reading below ${FEVER.toFixed(1)}\u00B0C, including today\u2019s reading. Clearing a patient notifies admin staff immediately.</div></div>
    <div class="panel"><div class="panel-h"><h3>Eligible for discharge (${el.length})</h3></div>
      ${el.length?el.map(p=>row(p,`<button class="btn primary" data-action="clear" data-id="${p.id}">Clear for discharge</button>`)).join(''):'<div class="empty">No one has reached 3 afebrile days yet.</div>'}</div>
    <div class="panel"><div class="panel-h"><h3>Close to eligible (${near.length})</h3><span class="muted small">2 days done, or today\u2019s reading missing</span></div>
      ${near.length?near.map(p=>row(p,streak(p).todayDone?'<span class="chip">1 more day</span>':`<button class="btn sm" data-action="request" data-id="${p.id}" ${p.priority?'disabled':''}>${p.priority?'Requested':'Request reading'}</button>`)).join(''):'<div class="empty">No one is close.</div>'}</div>
    <div class="muted">${m.waiting.length} patients are already cleared and waiting for admin to record the discharge.</div>
  </div>`;
}
function adminView(m){
  if(S.tab==='admit')return adminAdmit(m);
  if(S.tab==='discharge')return adminDischarge(m);
  const byRoom={};m.act.forEach(p=>byRoom[p.room]=p);
  const beds=[];
  for(let r=1;r<=CAP;r++){
    const p=byRoom[r];
    if(!p)beds.push(`<div class="bed free" title="Room ${roomLbl(r)} is free">${p2(r)}<small>Free</small></div>`);
    else{
      const last=p.readings[p.readings.length-1],g=last?grade(last.temp):'ok';
      const cls=p.status==='cleared'?'clr':g==='crit'?'crt':g==='fever'?'fvr':'';
      beds.push(`<button class="bed ${cls}" data-action="open" data-id="${p.id}" title="${esc(p.name)}${last?' \u00B7 '+last.temp.toFixed(1)+'\u00B0C':''}">${p2(r)}<small>${esc(p.name.split(' ')[0])}</small></button>`);
    }
  }
  const nextWL=sortedWL()[0];
  return `<div class="stack">
    <div class="kpis">
      <div class="kpi"><div class="l">Occupied</div><div class="v">${m.act.length}<small> / ${CAP}</small></div><div class="s">${m.free?m.free+' rooms free':'<b style="color:var(--crit)">Facility full</b>'}</div></div>
      <div class="kpi"><div class="l">Awaiting discharge</div><div class="v">${m.waiting.length}</div><div class="s">${m.longWait?`<b style="color:var(--crit)">${m.longWait} waiting over 6 h</b>`:'None waiting over 6 h'}</div></div>
      <div class="kpi"><div class="l">Waiting list</div><div class="v">${DB.waitlist.length}</div><div class="s">${DB.waitlist.filter(w=>w.urgent).length} urgent</div></div>
      <div class="kpi"><div class="l">Admitted today</div><div class="v">${DB.patients.filter(p=>isToday(p.admittedAt)).length}</div><div class="s">New registrations</div></div>
    </div>
    ${m.free&&nextWL?`<div class="banner acc"><div><b>${m.free} room${m.free>1?'s':''} free, ${DB.waitlist.length} waiting</b>Next in line: ${esc(nextWL.name)}${nextWL.urgent?' (urgent)':''}.</div><button class="btn primary" data-action="wl-admit" data-id="${nextWL.id}">Admit ${esc(nextWL.name.split(' ')[0])}</button></div>`
      :!m.free?`<div class="banner bad"><div><b>No free rooms</b>Record a discharge to release a room, then admit from the waiting list.</div><button class="btn" data-action="tab" data-k="discharge">Go to discharges</button></div>`:''}
    <div class="panel"><div class="panel-h"><h3>Room map</h3><span class="muted small">Select a room to view the patient</span></div>
      <div class="panel-b"><div class="beds">${beds.join('')}</div>
      <div class="legend"><span><i style="background:var(--accent-soft)"></i>Occupied</span><span><i style="background:var(--fever-soft)"></i>Fever</span><span><i style="background:var(--crit-soft);border-color:var(--crit)"></i>Critical</span><span><i style="background:var(--ok-soft);border-color:var(--ok)"></i>Cleared, awaiting discharge</span><span><i style="border-style:dashed"></i>Free</span></div></div></div>
  </div>`;
}
function adminAdmit(m){

      <form id="admitForm" data-form="admit" novalidate>

          <div class="field"><label for="a_sex">Sex</label><select id="a_sex"><option>F</option><option>M</option><option>Other</option></select></div>
        </div>

          <div class="field"><label for="a_phone">Emergency contact</label><input id="a_phone" inputmode="tel" placeholder="+91"></div>

    </div>
  </div>`;
}
function adminDischarge(m){

function headView(m){
  if(S.tab==='patients'){
    const list=m.act.filter(listMatch);
    return `<div class="stack"><div class="bar">${searchBox()}</div><div class="panel">${rowsOrEmpty(list,'head','No patients match.')}</div></div>`;
  }
  if(S.tab==='activity')return `<div class="panel"><div class="panel-h"><h3>Activity log</h3><span class="muted small">Newest first</span></div><div class="panel-b"><ul class="tl">${DB.log.map(l=>`<li><span class="tm">${fmtDT(l.ts)}</span><span><b>${esc(l.who)}</b> ${esc(l.text)}</span></li>`).join('')}</ul></div></div>`;
  const over=m.rate>BENCH, surv=1-m.rate, wrOver=m.wrate>BENCH;

  const issues=[
    {n:m.act.length-m.tempDone,t:'Patients with no temperature reading today',d:'Doctors cannot assess these patients yet.',sev:(m.act.length-m.tempDone)>20?'crit':'warn'},

  return `<div class="stack">

      <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn sm" data-action="csv" data-k="patients">${ico('down',15)}Patients CSV</button><button class="btn sm" data-action="csv" data-k="outcomes">${ico('down',15)}Outcomes CSV</button></div></div>
    <div class="kpis">
      <div class="kpi"><div class="l">Occupancy</div><div class="v">${m.act.length}<small> / ${CAP}</small></div><div class="s">${pct(m.act.length/CAP)} of rooms \u00B7 ${DB.waitlist.length} waiting</div></div>
      <div class="kpi"><div class="l">Temps recorded today</div><div class="v">${m.tempDone}<small> / ${m.act.length}</small></div><div class="s">${m.act.length-m.tempDone} pending</div></div>
      <div class="kpi"><div class="l">Doctor visits today</div><div class="v">${m.visitDone}<small> / ${m.act.length}</small></div><div class="s">${m.act.length-m.visitDone} pending</div></div>
      <div class="kpi"><div class="l">Awaiting discharge</div><div class="v">${m.waiting.length}</div><div class="s">Average delay ${hrsTxt(m.avgDelay)}</div></div>
    </div>
    <div class="grid2">
      <div class="panel"><div class="panel-h"><h3>Outcomes vs benchmark</h3><span class="muted small">${m.tot} closed cases</span></div><div class="panel-b">
        <div class="lbl">Mortality rate</div>
        <div style="display:flex;align-items:baseline;gap:10px;margin-top:4px"><span class="bignum" style="color:${over?'var(--crit)':'var(--ink)'}">${pct(m.rate)}</span><span class="muted">${m.deaths} deaths</span></div>
        <div class="gauge" aria-hidden="true"><div class="fill" style="width:${Math.min(100,m.rate/.3*100)}%;background:${over?'var(--crit)':'var(--ok)'}"></div><div class="tick" style="left:50%"><span>15% benchmark</span></div></div>
        <div class="lbl">Survival rate</div>
        <div style="display:flex;align-items:baseline;gap:10px;margin-top:4px"><span class="bignum" style="color:${over?'var(--crit)':'var(--ink)'}">${pct(surv)}</span><span class="muted">${m.disch} recovered</span></div>
        <div class="gauge" aria-hidden="true"><div class="fill" style="width:${surv*100}%;background:${over?'var(--crit)':'var(--ok)'}"></div><div class="tick" style="left:85%"><span>85% target</span></div></div>
        <div class="muted small">Last 7 days: ${m.wk} closed cases, mortality <b style="color:${wrOver?'var(--crit)':'inherit'}">${pct(m.wrate)}</b>. Mortality = deaths \u00F7 (deaths + discharges).</div>
      </div></div>
      <div class="panel"><div class="panel-h"><h3>Discharges and deaths, last 14 days</h3></div><div class="panel-b chart-wrap">${outcomeChart(m)}</div></div>
    </div>

    <div class="grid2">
      <div class="panel"><div class="panel-h"><h3>Operational problems</h3></div><div class="panel-b">
        ${issues.map(i=>`<div class="issue"><div class="num" style="color:${i.sev==='crit'?'var(--crit)':'inherit'}">${i.n}</div><div style="flex:1;min-width:0"><b>${i.t}</b><div class="muted small">${i.d}</div></div>${chip(i.sev,i.sev==='ok'?'OK':i.sev==='crit'?'Act now':'Watch')}</div>`).join('')}</div></div>
      <div class="panel"><div class="panel-h"><h3>Staff workload today</h3></div><div class="panel-b">
        <div class="lbl" style="margin-bottom:10px">Temperatures recorded, by nurse</div>${bars(nc)}
        <div class="lbl" style="margin:18px 0 10px">Patients visited, by doctor</div>${bars(dc)}</div></div>
    </div>
  </div>`;
}
function outcomeChart(m){
  const days=[];for(let o=13;o>=0;o--)days.push({k:offKey(o),d:0,x:0});
  m.closed.forEach(c=>{const day=days.find(d=>d.k===dayKey(c.at));if(day){c.outcome==='deceased'?day.x++:day.d++}});
  const max=Math.max(4,...days.map(d=>Math.max(d.d,d.x)));
  const W=560,H=210,L=26,B=24,T=10,iw=W-L-6,ih=H-B-T,bw=iw/14;
  const y=v=>T+ih-(v/max)*ih;
  let g='';const step=max>8?2:1;
  for(let v=0;v<=max;v+=step)g+=`<line x1="${L}" x2="${W-6}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${L-6}" y="${y(v)+4}" text-anchor="end" font-size="10" fill="var(--muted)" font-family="JetBrains Mono,monospace">${v}</text>`;
  days.forEach((d,i)=>{
    const x0=L+i*bw+bw*.12,w=bw*.34;
    g+=`<rect x="${x0}" y="${y(d.d)}" width="${w}" height="${T+ih-y(d.d)}" fill="var(--accent)" rx="2"><title>${d.k}: ${d.d} discharged</title></rect>`;
    g+=`<rect x="${x0+w+2}" y="${y(d.x)}" width="${w}" height="${T+ih-y(d.x)}" fill="var(--crit)" rx="2"><title>${d.k}: ${d.x} deaths</title></rect>`;
    if(i%3===0||i===13)g+=`<text x="${L+i*bw+bw/2}" y="${H-7}" text-anchor="middle" font-size="10" fill="var(--muted)" font-family="JetBrains Mono,monospace">${fmtD(new Date(d.k+'T00:00:00').getTime())}</text>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" style="min-width:420px;display:block" role="img" aria-label="Daily discharges and deaths over 14 days">${g}</svg>
  <div class="legend" style="margin-top:6px"><span><i style="background:var(--accent)"></i>Discharged</span><span><i style="background:var(--crit)"></i>Deaths</span></div>`;
}

function chartSVG(p){
  const rs=p.readings.slice(-24);
  if(!rs.length)return '<div class="empty">No readings yet.</div>';
  const W=540,H=210,L=34,R=12,T=12,B=26,lo=35.5,hi=41,iw=W-L-R,ih=H-T-B;
  const y=v=>T+ih-((Math.min(hi,Math.max(lo,v))-lo)/(hi-lo))*ih;
  const t0=rs[0].ts,t1=rs[rs.length-1].ts,x=ts=>rs.length<2||t1===t0?L+iw/2:L+((ts-t0)/(t1-t0))*iw;
  const col={ok:'var(--ok)',low:'var(--low)',fever:'var(--fever)',crit:'var(--crit)'};
  let g=`<rect x="${L}" y="${y(hi)}" width="${iw}" height="${y(FEVER)-y(hi)}" fill="var(--fever)" opacity=".07"/>`;
  [36,37,38,39,40,41].forEach(v=>{g+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="${v===38?'var(--fever)':'var(--line)'}" ${v===38?'stroke-dasharray="5 4"':''}/><text x="${L-6}" y="${y(v)+4}" text-anchor="end" font-size="10" fill="${v===38?'var(--fever)':'var(--muted)'}" font-family="JetBrains Mono,monospace">${v}</text>`});
  g+=`<polyline points="${rs.map(r=>x(r.ts)+','+y(r.temp)).join(' ')}" fill="none" stroke="var(--muted)" stroke-width="1.6" stroke-linejoin="round"/>`;
  rs.forEach(r=>{g+=`<circle cx="${x(r.ts)}" cy="${y(r.temp)}" r="4.5" fill="${col[grade(r.temp)]}" stroke="var(--surface)" stroke-width="1.5"><title>${r.temp.toFixed(1)}\u00B0C ${fmtDT(r.ts)}</title></circle>`});
  g+=`<text x="${L}" y="${H-8}" font-size="10" fill="var(--muted)" font-family="JetBrains Mono,monospace">${fmtD(t0)}</text><text x="${W-R}" y="${H-8}" text-anchor="end" font-size="10" fill="var(--muted)" font-family="JetBrains Mono,monospace">${fmtD(t1)}</text>`;
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Temperature history chart">${g}</svg>`;
}

  <h3 style="margin:18px 0 4px">Doctor visits</h3>
  <ul class="tl">${vs.slice(0,8).map(v=>`<li><span class="tm">${fmtDT(v.ts)}</span><span><b>${esc(v.doctor)}</b>${v.decision==='clear'?' '+chip('acc','Cleared'):v.decision==='death'?' '+chip('crit','Death recorded'):''}${v.tempSeen?'':' '+chip('warn','No reading yet')}<br>${esc(v.notes||'No notes')}<br><span class="muted small">${esc(v.treatment)}</span></span></li>`).join('')||'<li class="muted">No visits yet.</li>'}</ul>`,true);

function dl(name,rows){
  const csv=rows.map(r=>r.map(c=>'"'+String(c??'').replace(/"/g,'""')+'"').join(',')).join('\n');
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1500);
}
function exportCSV(kind){
  const m=metrics(),day=dayKey(Date.now());
  if(kind==='patients'){
    const rows=[['Patient ID','Name','Age','Sex','Room','Status','Admitted','Last temp (C)','Afebrile days','Temp today','Visit today']];
    m.act.forEach(p=>{const l=p.readings[p.readings.length-1];rows.push([p.id,p.name,p.age,p.sex,roomLbl(p.room),p.status,fmtD(p.admittedAt),l?l.temp:'',Math.min(streak(p).n,3),todays(p).length?'yes':'no',visitsToday(p).length?'yes':'no'])});
    dl('quarantine-round-patients-'+day+'.csv',rows);
  }else{
    const rows=[['Outcome','Date','Cleared at','Discharge delay (h)']];
    [...m.closed].sort((a,b)=>b.at-a.at).forEach(c=>rows.push([c.outcome,new Date(c.at).toISOString().slice(0,10),c.clearedAt?new Date(c.clearedAt).toISOString().slice(0,16).replace('T',' '):'',c.clearedAt?((c.at-c.clearedAt)/HR).toFixed(1):'']));
    dl('quarantine-round-outcomes-'+day+'.csv',rows);
  }
  toast('Export downloaded');
}

/* ============ events ============ */
function wlNote(){const n=sortedWL()[0];return n&&freeRooms().length?' Next in waiting list: '+n.name+'.':''}
const ACT={
  login:d=>{S.role=d.k;S.tab=TABS[d.k][0][0];S.filter=null;S.search='';S.bell=false;render();window.scrollTo(0,0)},
  logout:()=>{S.role=null;S.bell=false;closeModal();render()},
  tab:d=>{S.tab=d.k;S.filter=null;S.search='';S.bell=false;closeModal();render();window.scrollTo(0,0)},
  goto:d=>{S.tab=d.k;S.filter=d.f||null;S.search='';S.bell=false;render();window.scrollTo(0,0)},
  bell:()=>{S.bell=!S.bell;render()},
  theme:()=>{const n=isDark()?'light':'dark';document.documentElement.dataset.theme=n;try{localStorage.setItem('qr.theme',n)}catch(e){}render()},
  filter:d=>{S.filter=d.k;render()},
  open:d=>drawer(d.id),
  close:()=>closeModal(),
  scrim:(d,el,e)=>{if(e.target===el)closeModal()},
  temp:d=>tempModal(d.id,false),
  recheck:d=>tempModal(d.id,true),
  visit:d=>visitModal(d.id),
  qsave:d=>{
    const inp=document.getElementById('q_'+d.id);if(!inp)return;
    const v=parseFloat(inp.value);
    if(isNaN(v)||v<34||v>42){inp.classList.add('bad');inp.focus();toast('Enter a temperature between 34.0 and 42.0 \u00B0C');return}
    const p=P(d.id),t=Math.round(v*10)/10;
    recordTemp(d.id,t,false,'');render();
    const g=grade(t);
    toast(p.name+': '+t.toFixed(1)+'\u00B0C'+(g==='crit'?' \u2014 critical, doctor alerted':g==='fever'?' \u2014 fever':''));
    const nx=document.querySelector('.qin');if(nx)nx.focus();
  },
  request:d=>{const p=P(d.id);p.priority=true;addLog(USERS.doctor.name,'requested a temperature reading for '+p.name+' ('+p.id+')');save();toast('Nurses will see '+p.name+' at the top of their list');render()},
  clear:d=>{const p=P(d.id);recordVisit(d.id,{notes:'Afebrile for 3 consecutive days. Cleared for discharge.',treatment:'Observation only',decision:'clear'});toast(p.name+' cleared. Admin staff notified.');render()},
  discharge:d=>{const p=P(d.id);confirmModal('Record discharge','Mark <b>'+esc(p.name)+'</b> ('+p.id+') as discharged and release room <b>'+roomLbl(p.room)+'</b>?','discharge2',p.id,'Confirm discharge')},
  discharge2:d=>{const p=P(d.id);p.status='discharged';p.outcomeAt=Date.now();addLog(USERS.admin.name,'recorded discharge of '+p.name+' ('+p.id+'), room '+roomLbl(p.room)+' released');save();closeModal();render();toast('Discharged. Room '+roomLbl(p.room)+' is free.'+wlNote())},
  'wl-admit':d=>{
    const fr=freeRooms();if(!fr.length){toast('No free rooms. Record a discharge first.');return}
    const w=DB.waitlist.find(x=>x.id===d.id);if(!w)return;
    const id='QF-'+(DB.nextId++),room=fr[0];
    DB.patients.push({id,name:w.name,age:w.age,sex:w.sex,room,phone:w.phone,admittedAt:Date.now(),status:'admitted',clearedAt:null,outcomeAt:null,priority:false,readings:[],visits:[]});
    DB.waitlist=DB.waitlist.filter(x=>x.id!==d.id);
    addLog(USERS.admin.name,'admitted '+w.name+' ('+id+') from the waiting list to room '+roomLbl(room));save();render();toast(w.name+' admitted to room '+roomLbl(room));
  },
  'wl-remove':d=>{const w=DB.waitlist.find(x=>x.id===d.id);DB.waitlist=DB.waitlist.filter(x=>x.id!==d.id);if(w)addLog(USERS.admin.name,'removed '+w.name+' from the waiting list');save();render()},
  csv:d=>exportCSV(d.k),
  reset:()=>{DB=seed();save();closeModal();render();toast('Demo data reset')}
};
document.addEventListener('click',e=>{
  if(S.bell&&!e.target.closest('.bellwrap')){S.bell=false;render()}
  const el=e.target.closest('[data-action]');if(!el)return;
  const fn=ACT[el.dataset.action];if(fn)fn(el.dataset,el,e);
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){closeModal();if(S.bell){S.bell=false;render()}}
  if(e.key==='Enter'&&e.target.dataset&&e.target.dataset.q){e.preventDefault();ACT.qsave({id:e.target.dataset.q})}
});
document.addEventListener('input',e=>{
  if(e.target.id==='search'){S.search=e.target.value;render()}
  if(e.target.classList&&e.target.classList.contains('qin'))e.target.classList.remove('bad');
  if(e.target.id==='t_val'){
    const v=parseFloat(e.target.value),h=$('#t_hint');if(!h)return;
    if(isNaN(v)){h.textContent='';return}
    const g=grade(v);
    h.innerHTML=v<35?'<span class="muted">Unusually low, please check the reading</span>':'<span style="color:var(--'+(g==='ok'?'ok':g==='low'?'low':g==='fever'?'fever':'crit')+')">'+gradeLbl[g]+(g==='fever'||g==='crit'?' ('+FEVER.toFixed(1)+'\u00B0C or higher)':'')+'</span>';
  }
});
document.addEventListener('submit',e=>{
  e.preventDefault();const f=e.target,kind=f.dataset.form;
  if(kind==='temp'){
    const v=parseFloat($('#t_val').value),err=$('#t_err');
    if(isNaN(v)||v<34||v>42){err.textContent='Enter a temperature between 34.0 and 42.0 \u00B0C.';return}
    const p=P(f.dataset.id),re=f.dataset.recheck==='1',reason=re?$('#t_reason').value:'';
    recordTemp(p.id,Math.round(v*10)/10,re,reason);
    closeModal();render();toast('Saved '+v.toFixed(1)+'\u00B0C for '+p.name);
  }
  if(kind==='visit'){
    const dec=f.querySelector('input[name=dec]:checked').value,notes=$('#v_notes').value.trim();
    if(dec!=='continue'&&!notes){$('#v_err').textContent='Add a short clinical note for this decision.';return}
    const p=P(f.dataset.id);
    recordVisit(p.id,{notes:notes||'Routine visit.',treatment:$('#v_tx').value,decision:dec});
    closeModal();render();
    toast(dec==='clear'?p.name+' cleared. Admin staff notified.':dec==='death'?'Death recorded. Room '+roomLbl(p.room)+' released.'+wlNote():'Visit saved for '+p.name);
  }
  if(kind==='admit'){
    const name=$('#a_name').value.trim(),age=parseInt($('#a_age').value,10),err=$('#a_err');
    if(!name){err.textContent='Enter the patient\u2019s full name.';return}
    if(isNaN(age)||age<0||age>120){err.textContent='Enter a valid age.';return}
    const fr=freeRooms(),sex=$('#a_sex').value,phone=$('#a_phone').value;
    if(!fr.length){
      DB.waitlist.push({id:'WL-'+(DB.nextWL++),name,age,sex,phone,urgent:$('#a_urg').value==='1',addedAt:Date.now()});
      addLog(USERS.admin.name,'added '+name+' to the waiting list');save();render();toast(name+' added to the waiting list');return;
    }
    const room=parseInt($('#a_room').value,10);
    if(!fr.includes(room)){err.textContent='That room was just taken. Pick another.';return}
    const id='QF-'+(DB.nextId++);
    DB.patients.push({id,name,age,sex,room,phone,admittedAt:Date.now(),status:'admitted',clearedAt:null,outcomeAt:null,priority:false,readings:[],visits:[]});
    addLog(USERS.admin.name,'registered '+name+' ('+id+') in room '+roomLbl(room));save();render();toast(name+' registered in room '+roomLbl(room));
  }
});

try{const t=localStorage.getItem('qr.theme');if(t)document.documentElement.dataset.theme=t}catch(e){}
load();render();
</script>
